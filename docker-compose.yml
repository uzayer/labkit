# STALE / UNSUPPORTED: this file containerizes the app and is not used for
# local development. Use docker-compose.dev.yml for MongoDB only.
services:
  payload:
    build:
      context: .
    ports:
      - '3000:3000'
    volumes:
      - ./public/media:/app/public/media
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - payload_network

  mongo:
    image: mongodb/mongodb-community-server:latest
    entrypoint: ['mongod']
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
      MONGO_TCMALLOC_PER_CPU_CACHE_SIZE_BYTES: '0'
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: payloadcms
    command:
      - --storageEngine=wiredTiger
      - --auth
      - --setParameter
      - tcmallocMaxPerCPUCacheSize=0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval 'db.adminCommand("ping").ok' | grep 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - payload_network

networks:
  payload_network:
    driver: bridge

volumes:
  mongo_data:
