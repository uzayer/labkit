# Local development database only. Not a deployment artifact — the app itself
# runs on the host via `bun run dev`.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Runs as a single-node replica set so the MongoDB session/transaction APIs
# behave the way they do on Atlas. Payload's mongoose adapter silently skips
# transactions against a standalone mongod, which hides transaction bugs
# locally and surfaces them in production.
services:
  mongo:
    image: mongodb/mongodb-community-server:latest
    # Bypass the image entrypoint's unconditional Linux 6.19+ guard. The
    # TCMalloc cache is disabled below, which is the degraded-performance
    # workaround; no entrypoint initialization is needed for this local DB.
    entrypoint: ['mongod']
    # MongoDB 8+ otherwise refuses to start on OrbStack's Linux 7 kernel.
    # Disabling the per-CPU TCMalloc cache is the upstream kernel workaround.
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
      MONGO_TCMALLOC_PER_CPU_CACHE_SIZE_BYTES: '0'
    container_name: labkit-mongo
    command:
      - --replSet
      - rs0
      - --bind_ip_all
      - --setParameter
      - tcmallocMaxPerCPUCacheSize=0
    ports:
      # Loopback-only: never expose an unauthenticated mongod to the network.
      - '127.0.0.1:27017:27017'
    volumes:
      - labkit_mongo_data:/data/db
    # Self-initiates the replica set on first boot, then reports healthy.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (e) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"
          | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  labkit_mongo_data:
